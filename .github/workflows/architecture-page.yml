name: Deploy DigiBox architecture page

on:
  push:
    branches: [main]
    paths:
      - "docs/architecture/**"
      - ".github/workflows/architecture-page.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload architecture page
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/architecture

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
